# Grafana datasource provisioning — Prometheus
# Grafana reads this file on startup and auto-configures the datasource.
# No manual UI setup required after `docker compose up`.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
