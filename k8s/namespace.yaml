# =============================================================================
# k8s/namespace.yaml
#
# All pandemic-data-platform resources live in the `pandemic` namespace.
# Isolating the application in its own namespace means:
#   - RBAC policies can be scoped to this namespace only.
#   - Resource quotas prevent the platform from consuming the entire cluster.
#   - `kubectl get all -n pandemic` gives a clean view of the full stack.
#
# Local k3d cluster setup:
#   k3d cluster create pandemic-cluster --agents 2
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: pandemic
  labels:
    app.kubernetes.io/managed-by: kubectl
    project: pandemic-data-platform

---
# ResourceQuota prevents runaway resource consumption in the local k3d cluster.
# Values are sized for a developer laptop (8 GB RAM, 4 CPU cores).
# Adjust for a cloud cluster with: kubectl edit resourcequota -n pandemic
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pandemic-quota
  namespace: pandemic
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "20"

---
# LimitRange sets default resource requests/limits for pods that don't
# specify them explicitly — prevents unthrottled containers in the namespace.
apiVersion: v1
kind: LimitRange
metadata:
  name: pandemic-limits
  namespace: pandemic
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
