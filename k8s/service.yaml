# =============================================================================
# k8s/service.yaml — Kubernetes Services
#
# Service topology:
#
#   Internet / Host
#       │
#       │  NodePort 30800 (local k3d)
#       ▼
#   pandemic-api          ClusterIP  :8000   ← FastAPI
#       │
#       │  ClusterIP (internal DNS: pandemic-r-service:8001)
#       ▼
#   pandemic-r-service    ClusterIP  :8001   ← R plumber (internal only)
#
# The R service is intentionally ClusterIP-only: it is a backend service that
# should only be called by the API, never directly from the internet.
# This matches the Opção B microservice architecture described in the spec.
# =============================================================================

# ---------------------------------------------------------------------------
# FastAPI — NodePort for local k3d access
#
# NodePort exposes the API on the host at port 30800 without needing an
# external load balancer (which k3d does not have by default).
#
# Access locally:
#   curl http://localhost:30800/health
#   open http://localhost:30800/docs
#
# In a cloud cluster, change type to LoadBalancer or use the Ingress below.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pandemic-api
  namespace: pandemic
  labels:
    app: pandemic-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pandemic-data-platform
  annotations:
    # Prometheus operator pod-monitor discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: pandemic-api
  ports:
    - name: http
      port: 8000          # ClusterIP port
      targetPort: http    # references the named port in the deployment
      nodePort: 30800     # host port (must be in 30000-32767 range)
      protocol: TCP

---
# ---------------------------------------------------------------------------
# R Plumber — ClusterIP (internal only)
#
# No NodePort / LoadBalancer. The R service is only reachable from within
# the cluster. This prevents direct external access to raw model inference
# endpoints that have no authentication layer.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pandemic-r-service
  namespace: pandemic
  labels:
    app: pandemic-r-service
    app.kubernetes.io/component: r-service
    app.kubernetes.io/part-of: pandemic-data-platform
spec:
  type: ClusterIP
  selector:
    app: pandemic-r-service
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP

---
# ---------------------------------------------------------------------------
# Streamlit dashboard — NodePort
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pandemic-dashboard
  namespace: pandemic
  labels:
    app: pandemic-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: pandemic-data-platform
spec:
  type: NodePort
  selector:
    app: pandemic-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30851
      protocol: TCP

---
# ---------------------------------------------------------------------------
# Grafana — NodePort
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pandemic-grafana
  namespace: pandemic
  labels:
    app: pandemic-grafana
    app.kubernetes.io/component: monitoring
spec:
  type: NodePort
  selector:
    app: pandemic-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
