# =============================================================================
# k8s/secret.yaml — sensitive credentials (TEMPLATE ONLY — NO VALUES HERE)
#
# !! NEVER COMMIT REAL CREDENTIALS TO THIS FILE !!
# All data: fields are intentionally empty. Apply real values with kubectl:
#
#   kubectl create secret generic pandemic-secrets \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@host:5432/db" \
#     --from-literal=BRASILIO_TOKEN="" \
#     --from-literal=GRAFANA_PASSWORD="choose-a-strong-password" \
#     -n pandemic
#
# For Supabase free tier, DATABASE_URL comes from:
#   Project Settings → Database → Connection string → URI (asyncpg version)
#
# For production, use a secrets manager (Vault, AWS SSM, GCP Secret Manager)
# and inject via an init container or External Secrets Operator — not this file.
#
# Why no values here: any base64 string committed to Git — even "admin" —
# will be flagged by secret scanners (trivy, truffleHog, GitHub push protection)
# and creates a false sense of security for anyone cloning the repository.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: pandemic-secrets
  namespace: pandemic
  labels:
    app.kubernetes.io/part-of: pandemic-data-platform
  annotations:
    note: "Template only — apply real values with kubectl create secret (see header)"
type: Opaque
data: {}
# ↑ Intentionally empty. Do not add values here.
# Use: kubectl create secret generic pandemic-secrets --from-literal=KEY=value -n pandemic
